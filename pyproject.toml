[project]
name = "caseflow-agent"
version = "0.1.0"
requires-python = ">=3.12"
description = "An MCP Agent that revises knowledge and closes tickets through two real services with approvals and durable receipts."
dependencies = ["httpx>=0.28", "tiktoken>=0.9", "fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "mcp>=1.10", "pydantic-settings>=2.7"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.26", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
caseflow = "caseflow_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
